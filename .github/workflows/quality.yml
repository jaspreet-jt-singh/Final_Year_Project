name: Code quality
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      GROQ_API_KEY: ''
      OPENAI_API_KEY: ''
      OLLAMA_HOST: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.11'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv pip install -r scripts/requirements-dev.txt
      - run: npm ci --prefix frontend
      - run: .venv/bin/ruff check backend
      - run: .venv/bin/python scripts/generate_contracts.py --check
      - run: .venv/bin/python scripts/test_deployment.py
      - run: .venv/bin/python scripts/test_architecture.py
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: npm --prefix frontend run test:browser
